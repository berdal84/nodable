name: "ci"

on:
  workflow_dispatch:
  release:
    types:
      - created
  push:
    branches: [master]
  pull_request:
    branches: [master]



jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        # see https://github.com/actions/runner-images?tab=readme-ov-file
        includes:
          - target: windows
            os: windows-2025-vs2026
            artifact_name: nodable-x64-windows
          - target: emscripten
            os: windows-2025-vs2026
            artifact_name: nodable-x64-emscripten
          - target: linux
            os: ubuntu-24.04
            artifact_name: nodable-x64-linux

    runs-on: ${{ matrix.includes.os }}
    env:
      # TARGET:    desktop
      OUTPUT_DIR: "./${{matrix.includes.artifact_name}}"
    steps:
      - uses: actions/checkout@v4 # no submodules (libs are in the sources, see ./vcpkg and ./extern)
        with:
          fetch-tags:  true # Tag history is needed to generate nodable version and..
          fetch-depth: 100  # ..we also need some commits to generate the version name (uses `git describe --tags`), until now this value was enough.

      - run: rake install

      - run: rake build -- --output-dir=${{env.OUTPUT_DIR}} --target=${{matrix.includes.target}} --config=release --no-gui-tests

      - if: matrix.includes.target != 'emscripten'
        run: ./tools-tests && ./nodable-tests
        working-directory: ${{env.OUTPUT_DIR}}/bin/ # must run tests in /bin/, tests are not copied in dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{matrix.includes.artifact_name}}
          path: ${{env.OUTPUT_DIR}}/dist/
            
