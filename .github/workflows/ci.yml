name: "ci"

on:
  workflow_dispatch:
  release:
    types:
      - created
  push:
    branches: [master]
  pull_request:
    branches: [master]



jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        OS: [windows-2025-vs2026, ubuntu-24.04] # see https://github.com/actions/runner-images?tab=readme-ov-file
    runs-on: ${{ matrix.OS }}
    env:
      # Those are read by rake script
      BUILD_DIR: ./out
      # VERBOSE: true
      NDBL_SKIP_GUI_TEST: true
    steps:
      - uses: actions/checkout@v4 # no submodules (libs are in the sources, see ./vcpkg and ./extern)

      - run: rake install

      - run: rake -m build -- --build_type=release

      - run: ./tools-tests && ./nodable-tests
        working-directory: ${{ env.BUILD_DIR }}/bin/

      - uses: actions/upload-artifact@v4
        with:
          name: nodable-${{ env.TARGET }}-${{ matrix.OS }}-${{ env.BUILD_TYPE }}
          path: ${{ env.BUILD_DIR }}/bin/
