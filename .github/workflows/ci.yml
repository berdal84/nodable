name: "ci"

on:
  workflow_dispatch:
  release:
    types:
      - created
  push:
    branches: [master]
  pull_request:
    branches: [master]



jobs:
  build:
    strategy:
      matrix:
        OS: [ windows-latest, ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    env:
      # Those are read by rake script
      BUILD_TYPE: release # release|debug
      BUILD_DIR: ./out
      TARGET: desktop # desktop|web
      VERBOSE: true
      NDBL_SKIP_GUI_TEST: true
    steps:
      - uses: actions/checkout@v4 # no submodules (libs are in the sources, see ./vcpkg and ./extern)

      - run: rake install

      - run: rake build

      - run: rake test

      - uses: actions/upload-artifact@v4
        with:
          name: nodable-${{ env.TARGET }}-${{ env.BUILD_TYPE }}
          path: ./out/bin/
