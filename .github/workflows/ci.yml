name: "ci"

on:
  workflow_dispatch:
  release:
    types:
      - created
  push:
    branches: [master]
  pull_request:
    branches: [master]



jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        # see https://github.com/actions/runner-images?tab=readme-ov-file
        includes:
          - os: windows-2025-vs2026
            artfact_name: nodable-x64-windows
          - os: ubuntu-24.04
            artfact_name: nodable-x64-linux

    runs-on: ${{ matrix.includes.os }}
    env:
      TARGET:    desktop
      BUILD_DIR: build
    steps:
      - uses: actions/checkout@v4 # no submodules (libs are in the sources, see ./vcpkg and ./extern)

      - run: rake install -- --target=${{env.TARGET}}

      - run: rake -m build -- --target=${{env.TARGET}} --build-dir=${{env.BUILD_DIR}} --build-config=release --ignore-gui-tests

      - run: ./tools-tests && ./nodable-tests
        working-directory: ${{env.BUILD_DIR}}/bin/ # must run tests in /bin/, tests are not copied in dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{matrix.includes.artfact_name}}
          path: ${{env.BUILD_DIR}}/dist/
            
