<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Tools AppExample</title>
    <style>
      
      body, html {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      #content {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
      }

      #canvas {
        position: absolute;
        height: 100%;
        width:  100%;
      }

      #loading {
        display: flex;
        height: 100%;
        width:  100%;
        justify-content: center;
        align-items: center;
      }

      #status {
        font-size: smaller;
      }

      #loading[hidden] {
        display: none;
      }

      .loading-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap:     10px;
        padding: 10px;
        width:   300px;
        background-color: rgb(245, 245, 245);
      }

      .loading-row {
        display: flex;
        gap:     5px;
      }


    </style>
  </head>
  <body>
    
    <div id="content">

      <div id="loading">
        <div class="loading-box">
          <div>Loading Nodable</div>
          <div class="loading-row">
            <div id="status">Downloading...</div>
            <progress id="progress" value="0" max="100"></progress>
          </div>          
        </div>
      </div>

      <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>

    </div>

    <!-- textarea id="output" rows="8"></textarea -->

    <script type="text/javascript">
      var loading = document.getElementById("loading");
      var statusElement = document.getElementById("status");
      var progressElement = document.getElementById("progress");
      var spinnerElement = document.getElementById("spinner");
      var canvasElement = document.getElementById("canvas");
      var outputElement = document.getElementById("output");

      canvasElement.width  = 1; // At startup a size is needed
      canvasElement.height = 1;

      if (outputElement) outputElement.value = ""; // clear browser cache

      // As a default initial behavior, pop up an alert when webgl context is lost. To make your
      // application robust, you may want to override this behavior before shipping!
      // See http://www.khronos.org/registry/webgl/specs/latest/1.0/#5.15.2
      canvasElement.addEventListener(
        "webglcontextlost",
        (e) => {
          alert("WebGL context lost. You will need to reload the page.");
          e.preventDefault();
        },
        false,
      );

      var setStatus = (text) => {
        if (!setStatus.last) setStatus.last = { time: Date.now(), text: "" };
        if (text === setStatus.last.text) return;
        var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
        var now = Date.now();
        // if this is a progress update, skip it if too soon
        if (m && now - setStatus.last.time < 30) return;
        setStatus.last.time = now;
        setStatus.last.text = text;
        if (m) {
          text = m[1];
          progressElement.value  = parseInt(m[2]) * 100;
          progressElement.max    = parseInt(m[4]) * 100;
          loading.hidden         = false;
        } else {
          loading.hidden         = true;
        }
        statusElement.innerHTML = text;
      };

      var Module = {
        print(...args) {
          console.log(...args);
          // These replacements are necessary if you render to raw HTML
          //text = text.replace(/&/g, "&amp;");
          //text = text.replace(/</g, "&lt;");
          //text = text.replace(/>/g, "&gt;");
          //text = text.replace('\n', '<br>', 'g');
          if (outputElement) {
            var text = args.join(" ");
            outputElement.value += text + "\n";
            outputElement.scrollTop = outputElement.scrollHeight; // focus on bottom
          }
        },
        canvas: canvasElement,
        setStatus: setStatus,
        totalDependencies: 0,
        monitorRunDependencies(left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          setStatus(
            left
              ? "Preparing... (" +
                  (this.totalDependencies - left) +
                  "/" +
                  this.totalDependencies +
                  ")"
              : "All downloads complete.",
          );
        },
      };

      setStatus("Downloading...");
      window.onerror = (event) => {
        // TODO: do not warn on ok events like simulating an infinite loop or exitStatus
        setStatus("Exception thrown, see JavaScript console");
        setStatus = (text) => {
          if (text) console.error("[post-exception status] " + text);
        };
      };

    </script>
    <script async type="text/javascript" src="tools-app-example.js"></script>
  </body>
</html>
